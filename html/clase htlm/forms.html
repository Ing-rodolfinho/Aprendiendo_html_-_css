<!DOCTYPE html>
<html>
<head>
    <title>forms</title>
</head>
<body>
    <!--se utiliza la etiqueta form para crear un formulario, la etiqueta imput para crear campos de formulario, type para definir el tipo de campo, required para que el campo sea obligatorio, value para definir el valor del campo, name para definir el nombre del campo, place holder para mostrar un texto de ejemplo en el campo-->
    <form>
        <input type="text" placeholder="introduce tu nombre" required>
        <input type="email" name="correo" required>
        <input type="password" name="contraseña" required>
        <input type="checkbox">
        <input type="radio">
        <input type="file">
        <input type="date">
        <input type="submit">
    </form>
</body>
</html>
