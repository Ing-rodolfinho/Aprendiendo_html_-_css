<!DOCTYPE html>
<html>
<head>
    <title>parrafos y titulos</title>
</head>
<body>
    <!--hay 6 tipos de h pero el h1 solo se puede escribir una vez,mientras que el resto se pude usar  tantas veces como sea nesesario-->
    <h1> titulo</h1>
    <h2> titulo</h2>
    <h3> titulo</h3>
    <h4> titulo</h4>
    <h5> titulo</h5>
    <h6> titulo</h6>
    <!-- la p indica que la etiqueta es de un parrafo-->
    <p>buenas tardes esta es la primera vex utilizando este lenguaje de codigo ht</p>
</body>
</html>
